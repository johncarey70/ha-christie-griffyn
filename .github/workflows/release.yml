name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/christie_griffyn/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/christie_griffyn/manifest.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version is ${VERSION}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} already exists; skipping release."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/release-notes.md" <<'NOTES'
          Initial release. Local control of Christie Griffyn (TruLife+) projectors over the serial protocol on TCP port 3002: power with warming/cooling states, shutter, input, profile, test patterns, laser power and color, lens, image settings, signal/temperature/fan/hour sensors, health status, and a raw send_command service. Tested on a Griffyn 4K35-RGB, firmware 1.3.7. Install via HACS custom repository (Integration).
          NOTES
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
