name: Set repository topics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/set-topics.yml

permissions:
  administration: write
  contents: write

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Set topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/johncarey70/ha-christie-griffyn/topics" \
            -H "Accept: application/vnd.github+json" \
            -f names[]=home-assistant \
            -f names[]=christie \
            -f names[]=griffyn \
            -f names[]=projector
          echo "Topics set."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/set-topics.yml
          git commit -m "Remove one-shot topics workflow"
          git push
